
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSE 447 - Introduction to Natural Language Processing</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #172b4d;
    }
    header {
      background: #293b72;
      color: white;
      padding: 48px 20px;
      text-align: center;
    }
    header h1 { margin: 0 0 12px; }
    main {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 18px;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #00000012;
    }
    .card h2 { margin-top: 0; }
    .button {
      display: inline-block;
      background: #2563a6;
      color: white;
      padding: 11px 16px;
      border-radius: 7px;
      text-decoration: none;
      font-weight: bold;
    }
    .soon { color: #777; }
    footer {
      text-align: center;
      padding: 30px;
      color: #667;
    }
  </style>
</head>
<body>
  <header>
    <h1>CSE 447</h1>
    <h2>Introduction to Natural Language Processing</h2>
    <p>Interactive Learning Labs</p>
    <p>Dr. Maher Alrahhal</p>
  </header>

  <main>
    <h2>Learning Modules</h2>
    <div class="grid" id="modules"></div>
  </main>

  <footer>
    CSE 447 | Introduction to Natural Language Processing
  </footer>

  <script>
    const modules = [
      { title: "Module 1", url: null },
      { title: "Module 2", url: null },
      { title: "Module 3", url: null },
      { title: "Module 4", url: null },
      { title: "Module 5", url: null }
    ];

    const container = document.getElementById("modules");

    modules.forEach(module => {
      const card = document.createElement("div");
      card.className = "card";

      const title = document.createElement("h2");
      title.textContent = module.title;
      card.appendChild(title);

      if (module.url) {
        const link = document.createElement("a");
        link.className = "button";
        link.href = module.url;
        link.textContent = "Open Learning Lab";
        card.appendChild(link);
      } else {
        const message = document.createElement("p");
        message.className = "soon";
        message.textContent = "Coming Soon";
        card.appendChild(message);
      }

      container.appendChild(card);
    });
  </script>
</body>
</html>
